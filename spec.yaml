        label_column: "Main crop destroyed"
        color_column: "crop_destroyed_colors_rgba"
        sort: ascending
        label_suffix: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.month_crops_rgba.return }}

  - name: Overlay crop Events on Amboseli Map
    id: combine_ambo_crop_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_land_layer.return }}
        - ${{ workflow.create_bound_layer.return }}
        - ${{ workflow.create_fence_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_crop_layer.return }}

  - name: Calculate Zoom Level for crops Event Map
    id: crops_zoom_value
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.month_crops_rgba.return }}

  - name: Combine crop event layers with view state 
    id: zip_events_view_state
    task: groupbykey 
    partial: 
      iterables: 
        - ${{ workflow.combine_ambo_crop_layers.return }}
        - ${{ workflow.crops_zoom_value.return }}

  - name: Draw crops event map
    id: draw_crops_map
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state 
      argvalues: ${{ workflow.zip_events_view_state.return }}

  - name: Combine month names and crop event map 
    id: zip_crop_html_month
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.draw_crops_map.return }}
        - ${{ workflow.get_month_name.return }}

  - name: Persist crops event map
    id: persist_crop_map
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null # -- convert this to png
    mapvalues:
      argnames:
        - text
        - filename_suffix
      argvalues: ${{ workflow.zip_crop_html_month.return }}

  - name: Create per-month crop destroyed map widget
    id: widget_crops_map
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Crop Destroyed Map (by Month)"
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.persist_crop_map.return }}

  - name: Merge per-month crop destroyed map widgets
    id: widget_crops_map_grouped
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.widget_crops_map.return }}

  - name: Convert crop event map to png
    id: convert_crop_map_png
    task: ecoscope_workflows_ext_custom.tasks.io.html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
    mapvalues: 
      argnames: html_path 
      argvalues: ${{ workflow.persist_crop_map.return }}


  - name: Convert chart htmls to png
    id: convert_chart_html_png 
    task: html_to_png 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: 
        - ${{ workflow.persist_time_bin_chart.return }}
        - ${{ workflow.persist_damage_boxplot.return }}
        - ${{ workflow.persist_month_raid_locs.return }}
        - ${{ workflow.persist_crop_destroyed_pie.return }}
        - ${{ workflow.persist_crop_damage_pie.return }}
        - ${{ workflow.persist_monthly_other.return }}
        - ${{ workflow.persist_total_damage.return }}

      config: 
        width: 1280          
        height: 720          
        full_page: false
        device_scale_factor: 2.0 
        wait_for_timeout: 1
        timeout: 0 
        max_concurrent_pages: 5

  # Template generation 
  - name: Load packaged template for Big Life Crop Raid Report
    id: download_big_life_template
    task: ecoscope_workflows_ext_big_life.tasks.io.load_big_life_file
    partial: 
      filename: crop_raid_report_template.docx
  
  - name: Add outputs generated to template and persist
    id: generate_report
    task: generate_crop_raid_report
    # Always build the report, even when some charts were skipped for lack of
    # data; the skipped ones are simply left out, as when it scanned the folder.
    skipif:
      conditions:
        - never
    partial:
      template_path: ${{ workflow.download_big_life_template.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      # The report's images and tables, passed explicitly so it also works on
      # ecoscope-web, where the results folder is on GCS and can't be scanned.
      input_files:
        - ${{ workflow.persist_ele_acre_df.return }}
        - ${{ workflow.persist_overall_ele.return }}
        - ${{ workflow.persist_ranger_df.return }}
        - ${{ workflow.persist_total_df.return }}
        - ${{ workflow.persist_comb_species.return }}
        - ${{ workflow.persist_comb_crops.return }}
        - ${{ workflow.convert_density_map_png.return }}
        - ${{ workflow.convert_response_map_png.return }}
        - ${{ workflow.convert_species_map_png.return }}
        - ${{ workflow.convert_crop_map_png.return }}
        - ${{ workflow.convert_chart_html_png.return }}
      filename: "overall_report.docx"
      time_period: ${{ workflow.time_range.return }}
      generated_by: "Ecoscope"

  - name: Report files
    id: report_files
    task: create_files_single_view
    partial:
      files:
        - ${{ workflow.generate_report.return }}

  - name: Generate Big Life Crop Raid Dashboard Report
    id: crop_raid_dashboard_report
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.widget_density_map.return }}
        - ${{ workflow.widget_response_map.return }}
        - ${{ workflow.widget_species_map.return }}
        - ${{ workflow.widget_crops_map_grouped.return }}
        - ${{ workflow.widget_time_bin_chart.return }}
        - ${{ workflow.widget_damage_boxplot.return }}
        - ${{ workflow.widget_month_raid_locs.return }}
        - ${{ workflow.widget_crop_destroyed_pie.return }}
        - ${{ workflow.widget_crop_damage_pie.return }}
        - ${{ workflow.widget_monthly_other.return }}
        - ${{ workflow.widget_total_damage.return }}
        - ${{ workflow.widget_ele_acre_table.return }}
        - ${{ workflow.widget_overall_ele_table.return }}
        - ${{ workflow.widget_ranger_table.return }}
        - ${{ workflow.widget_total_acres_table.return }}
        - ${{ workflow.widget_species_damage_table.return }}
        - ${{ workflow.widget_crops_damage_table.return }}
      time_range: ${{ workflow.time_range.return }}
      groupers: ${{ workflow.groupers.return }}
      files: ${{ workflow.report_files.return }}

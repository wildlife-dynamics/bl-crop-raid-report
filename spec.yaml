id: crop_raid_report

metadata:
  name: BL Crop Raid Report
  description: >-
    Processes Big Life human-wildlife conflict crop raid events from EarthRanger for the
    Amboseli ecosystem, and produces charts, maps and summary tables of incidents, crop
    damage, species responsible and ranger response, on an interactive dashboard and in
    a Word report.
  maintainers:
    - name: Tevin Temu
      email: tevin@wildlifedynamics.com
      role: owner
    - name: Zakariya Husayn
      email: zakariya@wildlifedynamics.com
      role: reviewer
  outputs:
    - name: BL Crop Raid Dashboard
      type: dashboard
      description: >-
        Charts, maps and summary tables of crop raid incidents, crop damage, species
        responsible and ranger response.
      indicators:
        - name: Crop raids
    - name: Crop Raid Maps
      type: map
      description: >-
        A crop raid incident density map on a 2 km grid, ranger response timing and
        species responsible maps, and a crop destroyed map per month, over Amboseli
        land-use zones, ranch boundaries and the electric fence.
      indicators:
        - name: Crop raids
    - name: Crop Raid Charts
      type: plot
      description: >-
        Time-of-day incidents, damage size by ranger response timing, monthly incidents
        by location, crop species targeted by count and by area, and monthly incidents
        and damage.
      indicators:
        - name: Crop raids
    - name: Crop Raid Report
      type: file
      description: >-
        A Word report (overall_report.docx) with the maps, charts and summary tables,
        also offered as a dashboard download.
      indicators:
        - name: Crop raids
    - name: Crop Raid Data
      type: file
      description: >-
        Six summary tables, including acres damaged by elephants, elephant group size,
        ranger response timing and damage by location, species and crop (Parquet).
      indicators:
        - name: Crop raids
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/bl-crop-raid-report
  documentation: https://github.com/wildlife-dynamics/bl-crop-raid-report#readme
  readme: README.md
  keywords: [crop-raid, human-wildlife-conflict, elephants, big-life, amboseli]
  thumbnail: resources/thumbnail.png
requirements:
  - name: ecoscope-platform
    version: ">=2.25.1,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.4"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "1.0.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.4.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # Set workflow details 
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  
  # Define time range 
  - name: Time Range
    id: time_range
    task: set_time_range

  # Define groupers 
  - name: Set Data Grouping
    id: groupers
    task: set_groupers
    partial:
      groupers:
        - index_name: "ts_month_name"

  #  Connect to ER 
  - name: Connect to EarthRanger
    id: er_client_name 
    task: set_er_connection

  # Set basemaps connection 
  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 20

  # Download Amboseli Layers and style them 
  - name: Load packaged amboseli conservancy layers
    id: ambo_ranch_layers
    task: ecoscope_workflows_ext_big_life.tasks.io.load_big_life_file
    partial:
      filename: amboseli_ranch_conservancies_layers.gpkg
  
  - name: Load packaged amboseli ranch boundaries and electric fence
    id: ambo_bound_fence 
    task: ecoscope_workflows_ext_big_life.tasks.io.load_big_life_file
    partial: 
      filename: amboseli_group_ranch_boundaries_x_electric_fence.gpkg
  
  - name: Load packaged ambo conservancies
    id: ambo_conservancies 
    task: ecoscope_workflows_ext_big_life.tasks.io.load_big_life_file
    partial: 
      filename: amboseli_group_ranch_boundaries.gpkg

  - name: Load amboseli conservancy layers 
    id: load_ambo_layers 
    task: load_df 
    partial:  
      file_path: ${{ workflow.ambo_ranch_layers.return }}
      layer: null 
      deserialize_json: false 

  - name: Load amboseli ranch boundaries and electric fence 
    id: load_ambo_boundaries_fence 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_bound_fence.return }}
      layer: null 
      deserialize_json: false 
  
  - name: Load amboseli conservancies 
    id: load_ambo_conservancies 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_conservancies.return }}
      layer: null 
      deserialize_json: false 

  - name: Reproject gdf to 4326 for ambo layers 
    id: reproject_ambo_layers 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_layers.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo boundaries and electric fence 
    id: reproject_ambo_boundaries 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_boundaries_fence.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo conservancies
    id: reproject_ambo_conservancies
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_conservancies.return }}
      target_crs: "EPSG:4326"

  - name: Apply colormap to amboseli land_use column
    id: apply_ambo_color
    task: apply_color_map
    partial:
      df: ${{ workflow.reproject_ambo_layers.return }}
      input_column_name: land_use
      output_column_name: land_use_color
      colormap:
        Rangeland: "#a39c91"
        Rangeland and settlement: "#ffa07a"
        Settlement and agriculture: "#2f4f4f"
        Conservancies: "#8fbc8b"
        National parks and reserves: "#4d6600"

  - name: Create amboseli land_use layer
    id: create_land_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.apply_ambo_color.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: land_use_color
        get_line_color: land_use_color
        get_line_width: 0.85
        opacity: 0.75
      legend:
        title: Map Layers
        values:
          - label: Conservancies
            color: "#8fbc8b"

          - label: National park and reserves
            color: "#4d6600"

          - label: Settlement and agriculture
            color: "#2f4f4f"

          - label: Rangeland
            color: "#a39c91"

          - label: Rangeland and settlement
            color: "#ffa07a"

  - name: Filter to ambo ranch boundaries only
    id: filter_ambo_boundaries
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Ranch boundaries
      reset_index: true

  - name: Filter to ambo electric fence only
    id: filter_ambo_fence
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Electric Fence
      reset_index: true

  - name: Create ambo ranch boundaries layer
    id: create_bound_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.filter_ambo_boundaries.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [0, 0, 0]
        get_line_width: 0.95
        opacity: 0.55
      legend:
        title: ""
        values:
          - label: Ranch boundaries
            color: "#000000"

  - name: Create ambo electric fence layer
    id: create_fence_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.filter_ambo_fence.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [45, 98, 177]
        get_line_width: 5.5
        opacity: 1.0
      legend:
        title: ""
        values:
          - label: Electric fence
            color: "#2d62b1"
 
 # Retrieve crop raid events
  - name: Retrieve Crop Raid Events
    id: get_crop_events
    task: get_events
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      event_states: null
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details

      event_types:
        - hwc_crop_raids
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: true
      force_point_geometry: true 
  
  - name: Process crop raid events details
    id: process_crop_details
    task: ecoscope.platform.tasks.io.process_events_details
    partial: 
      df: ${{ workflow.get_crop_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true 

  - name: Normalize Crop Event Column Names
    id: normalize_crop_events 
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_crop_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Drop column prefix from events
    id: drop_crop_prefix 
    task: ecoscope.platform.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.normalize_crop_events.return }}
      prefix: event_details__
      duplicate_strategy: keep_original 

  - name: Rename and Filter Event Columns
    id: map_crop_columns 
    task: map_columns
    partial: 
      duplicate_strategy: suffix
      df: ${{ workflow.drop_crop_prefix.return }}
      drop_columns: [
        "event_category", 
        "event_type", 
        "reported_by",
        "event_type_display",
        ]
      retain_columns: []
      rename_columns: {}
      raise_if_not_found: false

  - name: Convert columns to float 
    id: convert_col_float 
    task: ecoscope_workflows_ext_big_life.tasks.transformation.convert_columns_to_float
    partial: 
      df: ${{ workflow.map_crop_columns.return }}
      columns: ["Damage size"]
      errors: "coerce"
      fill_value: 0 
      inplace: true 
      
  - name: Convert columns to int 
    id: convert_col_int 
    task: ecoscope_workflows_ext_mnc.tasks.transformation.convert_columns_to_int
    partial: 
      df: ${{ workflow.convert_col_float.return }}
      columns: ["Number of animals"]
      errors: "coerce"
      fill_value: 0
  
  - name: Replace Missing Values in Events with Unknown 
    id: replace_events_unknown
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fill_missing_values
    partial: 
      df: ${{ workflow.convert_col_int.return }}
      subset: [
        "Time of ranger response",
        "Species responsible",
        "Main crop destroyed",
        ]
      value: "Unknown"

  - name: Extract date attributes 
    id: extract_date
    task: ecoscope.platform.tasks.transformation.decompose_datetime
    partial:
      df: ${{ workflow.replace_events_unknown.return }}
      datetime_column: "Date and time of raid"
      components: ["month","month_name","hour"]
      column_prefix: "ts"
      remove_source: false

  - name: Assign custom time bins 
    id: assign_custom_bins 
    task: ecoscope_workflows_ext_big_life.tasks.transformation.assign_time_bins 
    partial: 
      df: ${{ workflow.extract_date.return }}
      hours: 3 
      hour_col: ts_hour

  # Draw time bin bar chart 
  - name: Aggregate events by time density_bins
    id: aggregate_time_bins 
    task: ecoscope_workflows_ext_big_life.tasks.transformation.aggregate_by 
    partial: 
      df: ${{ workflow.assign_custom_bins.return }}
      group_col: "time_bin"
      agg_col: null 
      agg_func: "count"
      agg_col_name: "Count"
      add_percent: false 
      sort: null
      pct_col_name: "Percentage"
      decimals: 1

  - name: Draw time bin bar chart 
    id: draw_time_bin_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.aggregate_time_bins.return }}
      category: time_bin
      mode: grouped
      y_axis: null
      stack_column: null
      agg_function: null
      stack_order: null
      ascending: true
      color_column: null
      plot_style: null
      overlay_opacity: 0.6
      category_order: [
        "12:01 – 15:00",
        "15:01 – 18:00",
        "18:01 – 21:00",
        "21:01 – 00:00",
        "00:00 – 03:00",
        "03:01 – 06:00",
        "06:01 – 09:00",
        "09:01 – 12:00",
        ]
      bar_chart_configs:
        - column: Count
          agg_func: sum
          label: Percent
          show_label: true
          style: 
            marker_color: "#6495ed"
            textposition: null 
            texttemplate: null 
      widget_id: null
      layout_style:
        bargap: 0.05 
        bargroupgap: 0.05 
        title: null 
        title_x: 0.01
        title_y: 0.95 
        showlegend: false
        font_size: 12
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Time of day"
        yaxis:
          title: "Number of incidents"

  - name: Persist time bin bar chart as html text
    id: persist_time_bin_chart
    task: persist_text
    partial:
      text: ${{ workflow.draw_time_bin_chart.return }}
      filename: "time_bin_bar_chart.html"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null # png

  - name: Create time of day incidents chart widget
    id: widget_time_bin_chart
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Time of Day of Incidents"
      data: ${{ workflow.persist_time_bin_chart.return }}

  - name: Filter df to only acres 
    id: filter_overall_acres 
    task: filter_row_values 
    partial: 
      df: ${{ workflow.assign_custom_bins.return }}
      column: "Measurement unit"
      values: ["Acre"]
  
  - name: Draw boxplot of damage size 
    id: draw_damage_boxplot 
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_boxplot
    partial:
      dataframe: ${{ workflow.filter_overall_acres.return }}
      y_column: "Damage size"
      x_column: "Time of ranger response"
      color_column: null
      orientation: "v"
      boxmode: "group"
      show_points: false 
      plot_style:
        marker_colors: [ "#7eb0d5" ]
      layout_style:
        showlegend: false
        bargap: 0.1 
        font_size: 12 
        font_color: "#222222"
      widget_id: null

  - name: Persist damage boxplot as html text
    id: persist_damage_boxplot
    task: persist_text
    partial:
      text: ${{ workflow.draw_damage_boxplot.return }}
      filename: "damage_size_boxplot.html"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null # png

  - name: Create damage size boxplot widget
    id: widget_damage_boxplot
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Damage Size by Ranger Response Time"
      data: ${{ workflow.persist_damage_boxplot.return }}
  
  - name: Map column values to assign crop raid location colors 
    id: assign_column_colors
    task: map_column_value
    partial:
      df: ${{ workflow.assign_custom_bins.return }}
      col: "Crop raid location"
      mapping: 
        "Core AOO": "#a6cee3"
        "Non-core AOO": "#b2df8a"
        "Outside AOO": "#fdbf6f"
        "Unknown": "#cfcfc4"
      new_col: "crop_raid_location_colors"
      default: "#cfcfc4"
      keep_unmapped: false

  - name: Add rgba column from crop_raid_location_colors
    id: crop_raid_loc_rgba 
    task: add_rgba_columns_from_hex
    partial: 
      df: ${{ workflow.assign_column_colors.return }}
      columns: [
        "crop_raid_location_colors",
        
        ]

  - name: Draw custom stacked bar chart of crop raid locations over time 
    id: draw_month_raid_locs
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.crop_raid_loc_rgba.return }}
      category: "ts_month_name"
      mode: stacked
      y_axis: "ts_month"
      stack_column: "Crop raid location"
      agg_function: "count"
      ascending: true
      color_column: "crop_raid_location_colors_rgba"
      bar_chart_configs: null
      stack_order:  [
        "Core AOO",
        "Non-core AOO",
        "Outside AOO"
        ]
      category_order: [
          "January", 
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December"
      ]
      overlay_opacity: 0.6
      plot_style: 
        xperiodalignment: "middle"
      widget_id: null
      layout_style:
        bargap: 0.05 
        bargroupgap: 0.05 
        title: null 
        title_x: 0.01
        title_y: 0.95 
        showlegend: true 
        font_size: 12
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Month"
        yaxis:
          title: "Number of incidents"

  - name: Persist custom stacked bar chart as html text
    id: persist_month_raid_locs
    task: persist_text
    partial:
      text: ${{ workflow.draw_month_raid_locs.return }}
      filename: "monthly_crop_raid_location_incidents.html"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null

  - name: Create monthly crop raid location chart widget
    id: widget_month_raid_locs
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Monthly Crop Raid Location Incidents"
      data: ${{ workflow.persist_month_raid_locs.return }}


  - name: Filter core area and where damage occured 
    id: filter_core_aoo 
    task: filter_row_values
    partial:
      df: ${{ workflow.crop_raid_loc_rgba.return }}
      column: "Crop raid location"
      values: ["Core AOO"]
  
  - name: Filter damage from core aoo
    id: filter_damage_core_aoo
    task: filter_row_values
    partial:
      df: ${{ workflow.filter_core_aoo.return }}
      column: "Damage caused"
      values: ["Yes"]

  # - name: Aggregate total land damage in core aoo 
  #   id: aggregate_damage_core_aoo
  #   task: ecoscope_workflows_ext_big_life.tasks.transformation.aggregate_by
  #   partial:
  #     df: ${{ workflow.filter_damage_core_aoo.return }}
  #     group_col: "ts_month_name"
  #     agg_col: "Damage size"
  #     agg_func: "sum"
  #     agg_col_name: "Total Damage Size"
  #     add_percent: true 
  #     sort: null
  
  - name: Map color columns to assign to crop destroyed 
    id: assign_crop_colors
    task: map_column_value
    partial:
      df: ${{ workflow.filter_damage_core_aoo.return }}
      col: "Main crop destroyed"
      mapping:
        "Avocado":       "#b3e2cd"
        "Banana":        "#fdcdac"
        "Beans":         "#cbd5e8"
        "Butternut":     "#f4cae4"
        "Cabbages":      "#e6f5c9"
        "Capsicum":      "#fff2ae"
        "Cassava":       "#f1e2cc"
        "French beans":  "#cccccc"
        "Grapes":        "#fbb4ae"
        "Green gram":    "#b3cde3"
        "Kales":         "#ccebc5"
        "Maize":         "#decbe4"
        "Onion":         "#fed9a6"
        "Oranges":       "#ffffcc"
        "Pawpaw":        "#e5d8bd"
        "Peas":          "#fddaec"
        "Potatoes":      "#d9f0d3"
        "Pumpkin":       "#fde8c8"
        "Sisal":         "#dce9f5"
        "Sugarcane":     "#f5e6f0"
        "Sunflower":     "#fefbd8"
        "Tomatoes":      "#fcd5ce"
        "Watermelon":    "#d4ede8"
        "Other":         "#e8e8e8"
        "None":          "#cfcfc4"
        "Unknown": "#cfcfc4"
      new_col: "crop_destroyed_colors"
      default: "#e8e8e8"
      keep_unmapped: false

  - name: Add rgba column from crop_destroyed_colors
    id: crop_destroyed_rgba
    task: add_rgba_columns_from_hex
    partial: 
      df: ${{ workflow.assign_crop_colors.return }}
      columns: [
        "crop_destroyed_colors",
        
        ]

  - name: Get crop destroyed incidents over time
    id: aggregate_crop_destroyed 
    task: ecoscope_workflows_ext_big_life.tasks.transformation.aggregate_by 
    partial: 
      df: ${{ workflow.crop_destroyed_rgba.return }}
      group_col: "Main crop destroyed"
      agg_col: null
      agg_func: "count"
      agg_col_name: "Count"
      add_percent: true
      sort: null
      pct_col_name: Percentage 
      decimals: 1

  - name: Map crop color values on aggregated df 
    id: map_crop_colors_agg
    task: map_column_value
    partial:
      df: ${{ workflow.aggregate_crop_destroyed.return }}
      col: "Main crop destroyed"
      mapping:
        "Avocado":       "#b3e2cd"
        "Banana":        "#fdcdac"
        "Beans":         "#cbd5e8"
        "Butternut":     "#f4cae4"
        "Cabbages":      "#e6f5c9"
        "Capsicum":      "#fff2ae"
        "Cassava":       "#f1e2cc"
        "French beans":  "#cccccc"
        "Grapes":        "#fbb4ae"
        "Green gram":    "#b3cde3"
        "Kales":         "#ccebc5"
        "Maize":         "#decbe4"
        "Onion":         "#fed9a6"
        "Oranges":       "#ffffcc"
        "Pawpaw":        "#e5d8bd"
        "Peas":          "#fddaec"
        "Potatoes":      "#d9f0d3"
        "Pumpkin":       "#fde8c8"
        "Sisal":         "#dce9f5"
        "Sugarcane":     "#f5e6f0"
        "Sunflower":     "#fefbd8"
        "Tomatoes":      "#fcd5ce"
        "Watermelon":    "#d4ede8"
        "Other":         "#e8e8e8"
        "None":          "#cfcfc4"
